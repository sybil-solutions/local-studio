appId: org.local.studio.desktop
productName: Local Studio
artifactName: Local-Studio-${version}-${os}-${arch}.${ext}
directories:
  output: ../dist/desktop
  buildResources: build
files:
  - main.cjs
  - preload.cjs
  - package.json
asar: true
npmRebuild: false
publish:
  provider: github
  owner: sybil-solutions
  repo: local-studio
mac:
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  category: public.app-category.developer-tools
  hardenedRuntime: true
  extraResources:
    - from: ../dist/darwin-arm64/
      to: local-studio/
linux:
  executableName: local-studio
  target:
    - target: AppImage
      arch: x64
  category: Development
  extraResources:
    - from: ../dist/linux-x64/
      to: local-studio/

name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Conventional commit gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=0
          while read -r sha; do
            subject=$(git log -1 --format=%s "$sha")
            printf '%s\n' "$subject" > /tmp/msg
            sh .githooks/commit-msg /tmp/msg || { echo "::error::$sha $subject"; bad=1; }
          done < <(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")
          exit $bad

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Line cap (20,000)
        run: |
          n=$(git ls-files '*.ts' '*.tsx' '*.css' '*.js' '*.cjs' '*.mjs' '*.sh' | xargs cat | wc -l)
          echo "lines: $n"
          [ "$n" -le 20000 ] || { echo "::error::codebase is $n lines, over the 20,000 cap"; exit 1; }
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Typecheck
        run: bun run typecheck
      - name: Build UI
        run: bun run build:ui
      - name: Compile controller
        run: bun run build:bin
